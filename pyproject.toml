[project]
name = "minideekseep"
version = "0.1.0"
description = "A small, trainable text-only study of DeepSeek V4.1 architecture"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = [
  "torch==2.14.0",
  "numpy>=2.1,<3",
  "tokenizers>=0.22,<0.24",
  "datasets>=4,<6",
]

[project.scripts]
minideekseep = "minideekseep.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "docs", "README.md", "THIRD_PARTY_NOTICES.md", "pyproject.toml", "uv.lock"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
extend-exclude = ["references"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
